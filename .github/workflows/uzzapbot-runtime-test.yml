name: UzzapBot Runtime Test

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to run the bot"
        required: false
        default: "10"
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: UzzapBot

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify runtime source
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("database.py").read_text()

          required = [
              'self.client.rpc(',
              '"room_bot_message"',
              '"p_is_system": False',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(
                  "database.py GameBot RPC implementation is incomplete: "
                  + ", ".join(missing)
              )

          if '"is_system": True' in source and '"sender_id": BOT_SENDER_ID' in source:
              raise SystemExit(
                  "Stale direct room_messages bot insert detected."
              )

          print("Runtime source verification passed.")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate runtime secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_SENDER_ID: ${{ secrets.BOT_SENDER_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          set -e
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BOT_SENDER_ID ADMIN_IDS; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          echo "Required runtime secrets are configured."

      - name: Run UzzapBot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_NAME: uzzapbot
          BOT_SENDER_ID: ${{ secrets.BOT_SENDER_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ADMIN_USERNAMES: ${{ secrets.ADMIN_USERNAMES }}
          POLL_SECONDS: "1.0"
          DEFAULT_POINTS: "10"
          DEFAULT_LIMIT: "100"
        run: |
          set -e
          minutes="${{ inputs.duration_minutes }}"
          case "$minutes" in
            ''|*[!0-9]*) echo "::error::duration_minutes must be a positive integer."; exit 1 ;;
          esac
          if [ "$minutes" -lt 1 ] || [ "$minutes" -gt 15 ]; then
            echo "::error::duration_minutes must be between 1 and 15."
            exit 1
          fi

          echo "Starting UzzapBot runtime test for $minutes minute(s)."
          set +e
          timeout --signal=SIGINT "${minutes}m" python bot.py
          rc=$?
          set -e

          if [ "$rc" -eq 124 ]; then
            echo "Runtime test reached its requested duration."
            exit 0
          fi
          if [ "$rc" -eq 130 ]; then
            echo "UzzapBot stopped cleanly after SIGINT."
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::UzzapBot exited with code $rc."
            exit "$rc"
          fi
