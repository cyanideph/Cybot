name: Gamecore Phase 3 Tests

on:
  push:
    branches:
      - main
      - gamecore-phase-3-legacy-rebuild
  pull_request:
    paths:
      - 'UzzapBot/**'
      - '.github/workflows/gamecore-tests.yml'

jobs:
  gamecore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UzzapBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
